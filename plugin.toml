[plugin]
id = "endless_test"
name = "无尽测试"
description = "带 AI 伙伴的 Roguelike 射击：8 职业自由构筑，60 节点科技树，边打边升级；Neko 自己选职业、定战术、放技能，还能听你指挥；12 页图鉴、4 个 Boss、联机测试版，存档在插件里换浏览器不丢。"
short_description = "Roguelike shooter with a Neko-driven AI wingman and unified saves."
keywords = [
    "无尽测试", "游戏", "开局", "重置", "战绩", "存档", "图鉴", "职业", "流派",
    "科技树", "构筑", "Roguelike", "射击", "刷怪", "Boss", "联机",
    "endless", "test", "game", "roguelike", "shooter", "save", "profile",
    "wingman", "partner", "build", "skilltree", "multiplayer",
    "AI伙伴", "AI 伙伴", "协同作战",
    "ゲーム", "ゲーム開始", "게임", "игра"
]
version = "1.1.0"
type = "plugin"
entry = "plugin.plugins.endless_test:EndlessTestPlugin"

[plugin.author]
name = "tangbai"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = true

[plugin_runtime]
enabled = true
auto_start = false
startup_failure = "warn"
timeout = 30

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "无尽测试"
entry = "static/panel.html"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"
